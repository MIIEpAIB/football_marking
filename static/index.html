<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Odds-API 早盘足球</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0f14;
      --panel: #141a22;
      --border: #243044;
      --text: #e8edf5;
      --muted: #8b9bb0;
      --accent: #3ddc97;
      --danger: #ff6b6b;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --sans: "DM Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      background: radial-gradient(1200px 600px at 10% -10%, #1a2636 0%, var(--bg) 55%);
      color: var(--text);
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      background: rgba(12, 15, 20, 0.85);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--accent); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    label { font-size: 0.8rem; color: var(--muted); }
    select, input, button {
      font-family: var(--sans);
      font-size: 0.875rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 0.45rem 0.65rem;
    }
    button {
      cursor: pointer;
      background: linear-gradient(180deg, #1f2a3a, #18212e);
      border-color: #2c3d52;
      font-weight: 600;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    main {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.2fr);
      gap: 1rem;
      padding: 1rem 1.25rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .card h2 {
      margin: 0;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.2);
    }
    .list {
      max-height: min(70vh, 720px);
      overflow: auto;
    }
    .row {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid rgba(36, 48, 68, 0.6);
      cursor: pointer;
      display: grid;
      gap: 0.2rem;
    }
    .row:hover { background: rgba(61, 220, 151, 0.06); }
    .row.active { border-left: 3px solid var(--accent); background: rgba(61, 220, 151, 0.08); }
    .teams { font-weight: 600; font-size: 0.92rem; }
    .meta { font-size: 0.78rem; color: var(--muted); font-family: var(--mono); }
    .detail {
      padding: 1rem;
      max-height: min(75vh, 800px);
      overflow: auto;
    }
    .detail h3 { margin: 0 0 0.5rem; font-size: 1rem; }
    .pill {
      display: inline-block;
      font-size: 0.72rem;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      background: #1e2a38;
      color: var(--muted);
      margin-right: 0.35rem;
    }
    pre {
      margin: 0.75rem 0 0;
      padding: 0.75rem;
      background: #0a0d12;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 0.72rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .error { color: var(--danger); padding: 1rem; font-size: 0.9rem; }
    .hint { font-size: 0.8rem; color: var(--muted); padding: 0 1rem 1rem; line-height: 1.5; }
    a { color: var(--accent); }
    .status-bar {
      font-size: 0.78rem;
      color: var(--muted);
      padding: 0 1.5rem 0.75rem;
      font-family: var(--mono);
    }
    .status-bar strong { color: var(--accent); }
    button.primary {
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <h1>Odds-API <span>早盘足球</span></h1>
    <div class="toolbar">
      <div>
        <label for="league">联赛</label><br />
        <select id="league" style="min-width: 220px;">
          <option value="">全部</option>
        </select>
      </div>
      <div>
        <label for="bookmakers">同步用庄家（逗号分隔，可留空）</label><br />
        <input id="bookmakers" type="text" placeholder="Bet365,Unibet" style="min-width: 200px;" />
      </div>
      <div style="align-self: flex-end;">
        <button id="sync" type="button" class="primary">同步到 Redis</button>
        <button id="refresh" type="button">从 Redis 加载</button>
      </div>
    </div>
  </header>
  <p id="cacheStatus" class="status-bar"></p>
  <main>
    <section class="card">
      <h2>赛前赛事</h2>
      <div id="list" class="list"></div>
      <p class="hint">
        流程：<strong>同步到 Redis</strong> 从 Odds-API 拉取并缓存；<strong>从 Redis 加载</strong> 仅读本地缓存，便于下注对照。需本机运行 Redis（<code>REDIS_URL</code>）。
      </p>
    </section>
    <section class="card">
      <h2>赛事详情与赔率</h2>
      <div id="detail" class="detail">
        <p class="hint" style="padding: 0;">选择比赛后优先读 Redis 赔率；若未缓存会自动从 Odds-API 拉取并写入 Redis。请先同步赛事并填写庄家。</p>
      </div>
    </section>
  </main>
  <script>
    const leagueEl = document.getElementById("league");
    const bookmakersEl = document.getElementById("bookmakers");
    const listEl = document.getElementById("list");
    const detailEl = document.getElementById("detail");
    const refreshBtn = document.getElementById("refresh");
    const syncBtn = document.getElementById("sync");
    const cacheStatusEl = document.getElementById("cacheStatus");

    let selectedId = null;
    let oddsPreviewCache = {};

    function apiErrorMessage(data, fallback) {
      if (typeof data === "string") return data;
      if (!data || typeof data !== "object") return fallback;
      const d = data.detail;
      if (typeof d === "string") return d;
      if (d && typeof d === "object" && d.message) return d.message;
      if (d) return JSON.stringify(d);
      if (data.message) return data.message;
      return fallback;
    }

    async function fetchJson(url, options) {
      const r = await fetch(url, options);
      const text = await r.text();
      let data;
      try { data = JSON.parse(text); } catch { data = text; }
      if (!r.ok) {
        throw new Error(apiErrorMessage(data, r.statusText));
      }
      return data;
    }

    function updateCacheStatus(meta) {
      if (!meta) {
        cacheStatusEl.textContent = "Redis：尚无缓存，请先同步";
        return;
      }
      cacheStatusEl.innerHTML =
        `Redis：<strong>${meta.event_count ?? 0}</strong> 场 · 赔率 <strong>${meta.odds_count ?? 0}</strong> 条 · ` +
        `庄家 ${escapeHtml(meta.bookmakers || "默认")} · 同步于 ${escapeHtml(meta.synced_at || "")}`;
    }

    async function refreshCacheStatus() {
      try {
        const h = await fetchJson("/api/health");
        updateCacheStatus(h.cache_meta);
        if (!h.redis_connected) {
          cacheStatusEl.innerHTML = '<span class="error">Redis 未连接，请启动 Redis 并配置 REDIS_URL</span>';
        }
      } catch {
        cacheStatusEl.textContent = "";
      }
    }

    async function loadLeagues() {
      const leagues = await fetchJson("/api/leagues?sport=football");
      leagueEl.innerHTML = '<option value="">全部</option>';
      if (Array.isArray(leagues)) {
        leagues.forEach((L) => {
          const opt = document.createElement("option");
          opt.value = L.slug || L.id || "";
          opt.textContent = L.name || opt.value;
          leagueEl.appendChild(opt);
        });
      }
    }

    function renderList(payload) {
      const events = payload.events || [];
      oddsPreviewCache = payload.odds_preview || {};
      listEl.innerHTML = "";
      if (!events.length) {
        listEl.innerHTML = '<div class="error">Redis 中暂无赛事，请先点击「同步到 Redis」</div>';
        return;
      }
      events.forEach((ev) => {
        const div = document.createElement("div");
        div.className = "row" + (selectedId === ev.id ? " active" : "");
        div.dataset.eventId = String(ev.id);
        const league = ev.league && ev.league.name ? ev.league.name : "";
        div.innerHTML = `
          <div class="teams">${escapeHtml(ev.home)} <span style="color:#5c6b7e">vs</span> ${escapeHtml(ev.away)}</div>
          <div class="meta">${escapeHtml(league)} · ${escapeHtml(ev.date || "")} · #${ev.id}</div>
        `;
        div.addEventListener("click", () => selectEvent(ev.id));
        listEl.appendChild(div);
      });
    }

    function escapeHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function loadPrematch() {
      refreshBtn.disabled = true;
      listEl.innerHTML = '<div class="hint" style="padding:1rem">从 Redis 加载中…</div>';
      try {
        const params = new URLSearchParams({ sport: "football" });
        const lg = leagueEl.value;
        if (lg) params.set("league", lg);
        const data = await fetchJson("/api/events/prematch?" + params.toString());
        renderList(data);
        updateCacheStatus(data.meta);
      } catch (e) {
        listEl.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
      } finally {
        refreshBtn.disabled = false;
      }
    }

    async function syncToRedis() {
      syncBtn.disabled = true;
      refreshBtn.disabled = true;
      cacheStatusEl.textContent = "正在从 Odds-API 同步到 Redis…";
      try {
        const params = new URLSearchParams({ sport: "football", fetch_odds: "true" });
        const lg = leagueEl.value;
        if (lg) params.set("league", lg);
        const bm = bookmakersEl.value.trim();
        if (bm) params.set("bookmakers", bm);
        const result = await fetchJson("/api/sync/prematch?" + params.toString(), { method: "POST" });
        updateCacheStatus(result.meta);
        if (result.odds_errors && result.odds_errors.length) {
          console.warn("odds sync errors", result.odds_errors);
        }
        await loadLeagues();
        await loadPrematch();
      } catch (e) {
        cacheStatusEl.innerHTML = `<span class="error">同步失败：${escapeHtml(e.message)}</span>`;
      } finally {
        syncBtn.disabled = false;
        refreshBtn.disabled = false;
      }
    }

    async function selectEvent(id) {
      selectedId = id;
      detailEl.innerHTML = '<p class="hint" style="padding:0">加载中…</p>';
      listEl.querySelectorAll(".row").forEach((el) => {
        el.classList.toggle("active", el.dataset.eventId === String(id));
      });
      try {
        const ev = await fetchJson("/api/events/" + id + "?sport=football");
        let odds = oddsPreviewCache[id] ?? oddsPreviewCache[String(id)] ?? null;
        if (!odds) {
          try {
            const q = new URLSearchParams({ sport: "football" });
            const bm = bookmakersEl.value.trim();
            if (bm) q.set("bookmakers", bm);
            odds = await fetchJson("/api/odds/" + id + "?" + q.toString());
            oddsPreviewCache[id] = odds;
          } catch (oe) {
            odds = { error: oe.message };
          }
        }
        const league = ev.league && ev.league.name ? ev.league.name : "";
        detailEl.innerHTML = `
          <h3>${escapeHtml(ev.home)} vs ${escapeHtml(ev.away)}</h3>
          <div>
            <span class="pill">${escapeHtml(league)}</span>
            <span class="pill">${escapeHtml(ev.date || "")}</span>
            <span class="pill">status: ${escapeHtml(ev.status || "")}</span>
          </div>
          <h3 style="margin-top:1rem">赛事</h3>
          <pre>${escapeHtml(JSON.stringify(ev, null, 2))}</pre>
          <h3 style="margin-top:1rem">赔率</h3>
          <pre>${escapeHtml(JSON.stringify(odds, null, 2))}</pre>
        `;
      } catch (e) {
        detailEl.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
      }
    }

    refreshBtn.addEventListener("click", loadPrematch);
    syncBtn.addEventListener("click", syncToRedis);
    leagueEl.addEventListener("change", loadPrematch);

    (async () => {
      try {
        const h = await fetchJson("/api/health");
        if (!h.redis_connected) {
          listEl.innerHTML = '<div class="error">Redis 未连接：请启动 Redis 并设置 REDIS_URL（默认 redis://127.0.0.1:6379/0）</div>';
          await refreshCacheStatus();
          return;
        }
        if (!h.api_key_configured) {
          listEl.innerHTML = '<div class="error">未配置 ODDS_API_KEY，同步功能不可用；仅可读取已有 Redis 缓存。</div>';
        }
        updateCacheStatus(h.cache_meta);
        try {
          await loadLeagues();
        } catch {
          /* 联赛需先同步 */
        }
        await loadPrematch();
      } catch (e) {
        listEl.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
